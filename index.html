            </div>

            <div id="contact-list" class="flex-1 overflow-y-auto custom-scrollbar">
                <!-- Contacts will be injected here -->
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chat-area" class="hidden sm:flex flex-1 flex-col h-full bg-white relative w-full sm:w-auto absolute sm:static inset-0 z-20">
            
            <!-- Empty State -->
            <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-slate-400 bg-slate-50/50">
                <i data-lucide="messages-square" class="w-16 h-16 mb-4 text-slate-300"></i>
                <h2 class="text-xl font-medium text-slate-600">Selecione uma conversa</h2>
                <p class="text-sm mt-2">Escolha um contato na lista lateral para ver o histórico.</p>
            </div>

            <!-- Chat Header -->
            <div id="chat-header" class="hidden p-4 border-b border-slate-200 bg-white flex justify-between items-center shadow-sm z-10">
                <div class="flex items-center gap-3">
                    <button id="back-btn" class="sm:hidden p-2 -ml-2 text-slate-500 hover:text-slate-800 rounded-full hover:bg-slate-100">
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    </button>
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-inner" id="chat-avatar">
                        ?
                    </div>
                    <div>
                        <h2 class="font-bold text-slate-800 text-lg leading-tight" id="chat-name">Nome do Contato</h2>
                        <p class="text-sm text-slate-500 flex items-center gap-1">
                            <i data-lucide="phone" class="w-3 h-3"></i>
                            <span id="chat-phone">Telefone</span>
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="chat-intent" class="hidden md:inline-flex bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded border border-slate-200 font-medium"></span>
                    <span id="chat-temp" class="hidden md:inline-flex bg-orange-100 text-orange-700 text-xs px-2 py-1 rounded border border-orange-200 font-medium"></span>
                    <button id="info-btn" class="p-2 text-slate-500 hover:text-blue-600 rounded-full hover:bg-blue-50 transition-colors" title="Ver Detalhes do Lead">
                        <i data-lucide="info" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Chat Messages -->
            <div id="chat-messages" class="hidden flex-1 overflow-y-auto p-4 custom-scrollbar bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-slate-50/50 space-y-4">
                <!-- Messages will be injected here -->
            </div>

            <!-- Chat Meta Panel (Slide in) -->
            <div id="meta-panel" class="hidden absolute top-0 right-0 h-full w-full sm:w-80 bg-white border-l border-slate-200 shadow-2xl z-30 transform transition-transform duration-300 translate-x-full">
                <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                    <h3 class="font-bold text-slate-700 flex items-center gap-2">
                        <i data-lucide="clipboard-list" class="w-4 h-4 text-blue-600"></i>
                        Detalhes do Lead
                    </h3>
                    <button id="close-meta-btn" class="text-slate-400 hover:text-slate-700 p-1 rounded-md hover:bg-slate-200">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="p-4 overflow-y-auto custom-scrollbar h-[calc(100%-60px)]" id="meta-content">

                </div>
            </div>

        </div>
    </div>

        let selectedChat = null;

        // Utility: Convert Unix timestamp to localized time string
        function formatTime(unixTimestamp) {
            if (!unixTimestamp) return '';
            // Checking if the timestamp is reasonable for today (mock data has 1777... which is future)
            // Just format it nicely
            const date = new Date(unixTimestamp * 1000);
            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' - ' + date.toLocaleDateString('pt-BR', {day: '2-digit', month: 'short'});
        }

        // Utility: get initials for avatar
        function getInitials(name) {
            if (!name || name.trim() === '') return '?';
            const parts = name.trim().split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return parts[0][0].toUpperCase();
        }

        function getContactName(lead) {
            return lead.metadata?.name || lead.metadata?.crm_data?.name || 'Cliente Sem Nome';
        }

        function renderSidebarList(filterText = '') {
            const listEl = document.getElementById('contact-list');
            listEl.innerHTML = '';

            const lowerFilter = filterText.toLowerCase();

            rawData.forEach((lead, index) => {
                const name = getContactName(lead);
                const phone = lead.phone || 'Sem número';
                const intent = lead.metadata?.detected_intent === 'course' ? 'Curso/Mentoria' : (lead.metadata?.detected_intent === 'penile_harmonization' ? 'Procedimento' : 'Indefinido');

                if (filterText && !name.toLowerCase().includes(lowerFilter) && !phone.includes(filterText)) {
                    return; // Skip if it doesn't match
                }

                // Get last message snippet
                const lastMsg = lead.history && lead.history.length > 0 ? lead.history[lead.history.length - 1].content : 'Nenhuma mensagem';
                const shortMsg = lastMsg.length > 35 ? lastMsg.substring(0, 35) + '...' : lastMsg;
                const lastMsgTime = lead.history && lead.history.length > 0 ? formatTime(lead.history[lead.history.length - 1].created_at) : '';

                const div = document.createElement('div');
                div.className = `p-4 border-b border-slate-100 cursor-pointer hover:bg-slate-50 transition-colors ${selectedChat === index ? 'bg-blue-50 border-l-4 border-l-blue-500' : 'border-l-4 border-l-transparent'}`;
                
                div.onclick = () => selectContact(index);

                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="font-semibold text-slate-800 text-sm truncate pr-2">${name}</h3>
                        <span class="text-xs text-slate-400 whitespace-nowrap">${lastMsgTime.split(' - ')[0]}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <p class="text-xs text-slate-500 truncate mr-2">${shortMsg}</p>
                        ${intent !== 'Indefinido' ? `<span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-medium ${intent === 'Curso/Mentoria' ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700'}">${intent === 'Curso/Mentoria' ? 'Curso' : 'Clínica'}</span>` : ''}
                    </div>
                `;
                listEl.appendChild(div);
            });

            // Re-initialize icons
            lucide.createIcons();
        }

        function selectContact(index) {
            selectedChat = index;
            const lead = rawData[index];
            const name = getContactName(lead);

            // Hide empty state, show chat elements
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('chat-header').classList.add('flex');
            document.getElementById('chat-messages').classList.remove('hidden');
            
            // On mobile, show chat area and hide sidebar
            if (window.innerWidth < 640) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('chat-area').classList.remove('hidden');
            }

            // Update Header
            document.getElementById('chat-name').textContent = name;
            document.getElementById('chat-phone').textContent = `+${lead.phone}`;
            document.getElementById('chat-avatar').textContent = getInitials(name);

            // Badges
            const intentEl = document.getElementById('chat-intent');
            if (lead.metadata?.detected_intent) {
                intentEl.textContent = lead.metadata.detected_intent === 'course' ? 'Interesse: Curso' : 'Interesse: Procedimento';
                intentEl.classList.remove('hidden');
            } else {
                intentEl.classList.add('hidden');
            }

            const tempEl = document.getElementById('chat-temp');
            if (lead.metadata?.lead_temperature) {
                const temp = lead.metadata.lead_temperature;
                tempEl.textContent = `Temperatura: ${Math.round(temp * 100)}%`;
                tempEl.classList.remove('hidden');
                if (temp >= 0.8) tempEl.className = "hidden md:inline-flex bg-red-100 text-red-700 text-xs px-2 py-1 rounded border border-red-200 font-medium";
                else if (temp >= 0.5) tempEl.className = "hidden md:inline-flex bg-orange-100 text-orange-700 text-xs px-2 py-1 rounded border border-orange-200 font-medium";
                else tempEl.className = "hidden md:inline-flex bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded border border-blue-200 font-medium";
            } else {
                tempEl.classList.add('hidden');
            }

            // Render Messages
            const messagesContainer = document.getElementById('chat-messages');
            messagesContainer.innerHTML = '';
            
            if (lead.history && lead.history.length > 0) {
                lead.history.forEach(msg => {
                    const isUser = msg.role === 'user';
                    const time = formatTime(msg.created_at);
                    
                    const bubbleWrapper = document.createElement('div');
                    bubbleWrapper.className = `flex w-full ${isUser ? 'justify-start' : 'justify-end'}`;
                    
                    // Replace newlines with <br> for proper rendering
                    const formattedContent = msg.content.replace(/\n/g, '<br>');

                    bubbleWrapper.innerHTML = `
                        <div class="max-w-[85%] md:max-w-[70%] rounded-2xl px-4 py-2.5 shadow-sm relative ${isUser ? 'bg-white text-slate-800 rounded-tl-sm border border-slate-200' : 'bg-blue-600 text-white rounded-tr-sm'}">
                            <div class="text-sm leading-relaxed">${formattedContent}</div>
                            <div class="text-[10px] text-right mt-1 ${isUser ? 'text-slate-400' : 'text-blue-200'}">
                                ${time}
                            </div>
                        </div>
                    `;
                    messagesContainer.appendChild(bubbleWrapper);
                });
                
                // Scroll to bottom
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } else {
                messagesContainer.innerHTML = '<div class="text-center text-slate-400 py-10">Nenhuma mensagem encontrada neste histórico.</div>';
            }

            // Update Meta Panel
            renderMetaPanel(lead);

            // Re-render sidebar to update the selected state visual
            renderSidebarList(document.getElementById('searchInput').value);
        }

        function renderMetaPanel(lead) {
            const content = document.getElementById('meta-content');
            let html = '';

            // Resumo
            if (lead.metadata?.summary) {
                // simple markdown bold parsing for the summary
                const formattedSummary = lead.metadata.summary.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                html += `
                    <div class="mb-6">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Resumo da IA</h4>
                        <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 text-sm text-slate-700 leading-relaxed shadow-sm">
                            ${formattedSummary}
                        </div>
                    </div>
                `;
            }

            // Info Gerais
            html += `
                <div class="mb-6">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Dados do Cliente</h4>
                    <ul class="space-y-3 bg-white border border-slate-100 rounded-lg p-3 shadow-sm">
                        <li class="flex justify-between items-center text-sm border-b border-slate-50 pb-2">
                            <span class="text-slate-500">Nome:</span>
                            <span class="font-medium text-slate-800">${getContactName(lead)}</span>
                        </li>
                        <li class="flex justify-between items-center text-sm border-b border-slate-50 pb-2">
                            <span class="text-slate-500">Telefone:</span>
                            <span class="font-medium text-slate-800">+${lead.phone}</span>
                        </li>
                        <li class="flex justify-between items-center text-sm border-b border-slate-50 pb-2">
                            <span class="text-slate-500">Cidade:</span>
                            <span class="font-medium text-slate-800">${lead.metadata?.city || 'Não identificada'}</span>
                        </li>
                        <li class="flex justify-between items-center text-sm">
                            <span class="text-slate-500">Procedimento:</span>
                            <span class="font-medium text-slate-800 text-right">${lead.metadata?.procedures ? lead.metadata.procedures.join(', ') : 'Não identificado'}</span>
                        </li>
                    </ul>
                </div>
            `;

            // CRM Analytics
            const intent = lead.metadata?.detected_intent || 'N/A';
            const stage = lead.metadata?.buying_stage || 'N/A';
            const maturity = lead.metadata?.lead_maturity || 'N/A';
            const effort = lead.metadata?.interaction_effort || 'N/A';
            const score = lead.metadata?.engagement_score || 'N/A';

            html += `
                <div class="mb-6">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Métricas de Venda</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="bg-slate-50 p-2 rounded border border-slate-100">
                            <div class="text-[10px] text-slate-400">Estágio de Compra</div>
                            <div class="text-sm font-semibold text-slate-700 capitalize">${stage.replace('_', ' ')}</div>
                        </div>
                        <div class="bg-slate-50 p-2 rounded border border-slate-100">
                            <div class="text-[10px] text-slate-400">Maturidade</div>
                            <div class="text-sm font-semibold text-slate-700 capitalize">${maturity.replace('_', ' ')}</div>
                        </div>
                        <div class="bg-slate-50 p-2 rounded border border-slate-100">
                            <div class="text-[10px] text-slate-400">Esforço Interação</div>
                            <div class="text-sm font-semibold text-slate-700 capitalize">${effort.replace('_', ' ')}</div>
                        </div>
                        <div class="bg-slate-50 p-2 rounded border border-slate-100">
                            <div class="text-[10px] text-slate-400">Score Engajamento</div>
                            <div class="text-sm font-semibold text-blue-600">${score} / 10</div>
                        </div>
                    </div>
                </div>
            `;

            content.innerHTML = html;
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderSidebarList(e.target.value);
        });

        document.getElementById('back-btn').addEventListener('click', () => {
            document.getElementById('chat-area').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
        });

        const metaPanel = document.getElementById('meta-panel');
        document.getElementById('info-btn').addEventListener('click', () => {
            metaPanel.classList.toggle('hidden');
            // Small timeout to allow display:block to apply before animating transform
            setTimeout(() => {
                metaPanel.classList.toggle('translate-x-full');
            }, 10);
        });

        document.getElementById('close-meta-btn').addEventListener('click', () => {
            metaPanel.classList.add('translate-x-full');
            setTimeout(() => {
                metaPanel.classList.add('hidden');
            }, 300);
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('lead-count').textContent = rawData.length;
            renderSidebarList();
            lucide.createIcons();
        });

    </script>
